# Lint, tests et build : la logique est partagée dans TaskF0RCE/.github.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Utilisé par la release pour tester la PR de release.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: TaskF0RCE/.github/.github/workflows/ci.yml@main
